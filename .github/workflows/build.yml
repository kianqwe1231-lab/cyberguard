name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " build.log | head -10 | while IFS= read -r line; do
              line="${line//%/%25}"
              echo "::error title=Kotlin error::$line"
            done
            grep -E "What went wrong" -A5 build.log | head -10 | while IFS= read -r line; do
              line="${line//%/%25}"
              echo "::error title=Gradle::$line"
            done
          fi
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
